<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Berea</title>
<meta name="description" content="Read the New Testament in five translations, with the Greek text, a lexicon, and the early Church Fathers alongside.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=Inter:wght@500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
<script>/* apply saved theme before first paint */
try{ const t = JSON.parse(localStorage.getItem('verbum-prefs') || '{}').theme; if(t) document.documentElement.setAttribute('data-theme', t); }catch(e){}
</script>

<main class="hero">
  <h1 class="wordmark" aria-label="Berea">
    <span class="face latin" aria-hidden="true"><span style="--i:0">B</span><span class="sc" style="--i:1">e</span><span class="sc" style="--i:2">r</span><span class="sc" style="--i:3">e</span><span class="sc" style="--i:4">a</span></span>
    <span class="face greek" lang="el" aria-hidden="true"><span style="--i:0">Β</span><span style="--i:1">έ</span><span style="--i:2">ρ</span><span style="--i:3">ο</span><span style="--i:4">ι</span><span style="--i:5">α</span></span>
  </h1>
  <p class="tagline">Read the New Testament, compare translations with a Greek lexicon, and reference commentaries from the early Church.</p>
  <a class="cta" href="/berea/">Open the reader</a>
</main>
<nav class="footnav">
  <a href="https://www.github.com/berea-bible">Open source on GitHub</a>
</nav>
<button id="themeBtn" title="Toggle theme">&#9788;</button>

<script>/* theme toggle; shares the reader's prefs key so the choice carries over */
document.getElementById('themeBtn').addEventListener('click', ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const next = cur === 'dark' ? 'light' : cur === 'light' ? 'dark' : (sysDark ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', next);
  try{
    const prefs = JSON.parse(localStorage.getItem('verbum-prefs') || '{}');
    prefs.theme = next;
    localStorage.setItem('verbum-prefs', JSON.stringify(prefs));
  }catch(e){}
});

/* touch screens have no hover, so a tap toggles the Greek name instead */
document.querySelector('.wordmark').addEventListener('pointerup', e=>{
  if(e.pointerType !== 'mouse') e.currentTarget.classList.toggle('flipped');
});
</script>
</html>
